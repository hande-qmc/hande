test-pyhande:
    stage: TEST PYHANDE
    tags:
        - hande-testing
    before_script:
        - module load anaconda
        - conda activate pyhandeenv
        - export PYTHONPATH=$PYTHONPATH:$pwd/tools/pyhande
    script:
        - cd tools/pyhande
        - pytest
    except:
        - schedules
    resource_group: pyhande

